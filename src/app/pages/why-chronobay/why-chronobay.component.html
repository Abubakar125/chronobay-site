@if (isMenuOpen()) {
  <app-nav-menu [isOpen]="isMenuOpen()" (closed)="isMenuOpen.set(false)" />
}

<div class="why-page">
  <!-- Top navbar -->
  <div class="mx-3 mt-3 sm:mx-5 sm:mt-5 xl:mx-8 xl:mt-8">
    <nav
      class="backdrop-blur-[2px] bg-[rgba(255,255,255,0.1)] rounded-[7px] h-[56px] sm:h-[70px] xl:h-[82px] px-3 sm:px-4 xl:px-6 flex items-center justify-between relative"
    >
      <!-- Left: social icons — hidden on mobile to save space -->
      <div class="hidden sm:flex items-center gap-2 xl:gap-3">
        <a
          href="#"
          aria-label="Instagram"
          class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
        >
          <img
            src="icon/insta.png"
            alt=""
            class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px] object-contain"
          />
        </a>
        <a
          href="#"
          aria-label="Twitter"
          class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
        >
          <img
            src="icon/twitter.png"
            alt=""
            class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px] object-contain"
          />
        </a>
        <a
          href="#"
          aria-label="LinkedIn"
          class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
        >
          <img
            src="icon/linkedIn.png"
            alt=""
            class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px] object-contain"
          />
        </a>
        <a
          href="#"
          aria-label="YouTube"
          class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
        >
          <img
            src="icon/youtube.png"
            alt=""
            class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px] object-contain"
          />
        </a>
      </div>
      <!-- Mobile: spacer so logo stays centered -->
      <div class="sm:hidden w-8"></div>

      <!-- Center: Logo -->
      <div class="absolute left-1/2 -translate-x-1/2 pointer-events-none">
        <img
          src="images/logo.svg"
          alt="Chronobay"
          class="h-9 sm:h-11 xl:h-14 w-auto"
        />
      </div>

      <!-- Right: GlassButton + icon buttons -->
      <div class="flex items-center gap-2 xl:gap-3">
        <button class="glass-btn hidden lg:inline-flex">
          Apply For Membership
        </button>

        <button
          aria-label="Account"
          class="w-9 h-9 xl:w-11 xl:h-11 flex items-center justify-center bg-[rgba(255,255,255,0.06)] border border-[rgba(255,255,255,0.1)] rounded-[22px] transition-colors hover:bg-[rgba(255,255,255,0.1)]"
        >
          <img
            src="icon/person.png"
            alt=""
            class="w-[15px] h-[15px] xl:w-[18px] xl:h-[18px] object-contain"
          />
        </button>

        <button
          aria-label="Menu"
          class="w-9 h-9 xl:w-11 xl:h-11 flex flex-col items-center justify-center gap-[5px] bg-[rgba(255,255,255,0.06)] border border-[rgba(255,255,255,0.1)] rounded-[22px] transition-colors hover:bg-[rgba(255,255,255,0.1)]"
          (click)="isMenuOpen.set(true)"
        >
          <span
            class="block w-[15px] xl:w-[18px] h-px bg-cb-cream rounded-[2px]"
          ></span>
          <span
            class="block w-[10px] xl:w-3 h-px bg-cb-cream rounded-[2px]"
          ></span>
        </button>
      </div>
    </nav>
  </div>

  <app-why-hero />
  <app-why-stats-bar />
  <app-why-reasons />
  <app-why-comparison />
  <app-why-testimonials />
  <app-why-audience />
  <app-why-cta />

  <!-- Footer (shared) -->
  <footer class="bg-[#061b16] px-4 pt-[45px] pb-[60px]">
    <div class="max-w-[1400px] mx-auto">
      <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6 lg:gap-0 min-h-[88px] py-2 lg:py-0">
        <div class="flex flex-col items-start gap-[12px]">
          <img src="images/logo.svg" alt="Chronobay" class="h-[48px] w-auto object-contain" />
          <p class="font-inter font-normal text-[rgba(247,245,241,0.25)] text-[12px] leading-[18px] tracking-[0.08em]">Dubai, UAE · Private Marketplace</p>
          <p class="font-inter font-normal text-[rgba(247,245,241,0.2)] text-[11px] leading-[16.5px] tracking-[0.05em]">© 2026 Chronobay. All rights reserved.</p>
        </div>
        <nav class="flex flex-wrap items-center gap-x-8 gap-y-3">
          <a href="#" class="font-inter font-normal text-[rgba(247,245,241,0.35)] text-[12px] leading-[18px] tracking-[0.06em] hover:text-cb-cream transition-colors">Privacy Policy</a>
          <a href="#" class="font-inter font-normal text-[rgba(247,245,241,0.35)] text-[12px] leading-[18px] tracking-[0.06em] hover:text-cb-cream transition-colors">Terms</a>
          <a href="#" class="font-inter font-normal text-[rgba(247,245,241,0.35)] text-[12px] leading-[18px] tracking-[0.06em] hover:text-cb-cream transition-colors">Support</a>
          <a href="#" class="font-inter font-normal text-[rgba(247,245,241,0.35)] text-[12px] leading-[18px] tracking-[0.06em] hover:text-cb-cream transition-colors">Journal</a>
          <a href="#" class="font-inter font-normal text-[rgba(247,245,241,0.35)] text-[12px] leading-[18px] tracking-[0.06em] hover:text-cb-cream transition-colors">Newsletter</a>
        </nav>
        <div class="flex items-center gap-3">
          <a href="#" aria-label="Instagram" class="w-10 h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"><img src="icon/insta.png" alt="" class="w-[15px] h-[15px] object-contain" /></a>
          <a href="#" aria-label="Twitter" class="w-10 h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"><img src="icon/twitter.png" alt="" class="w-[15px] h-[15px] object-contain" /></a>
          <a href="#" aria-label="LinkedIn" class="w-10 h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"><img src="icon/linkedIn.png" alt="" class="w-[15px] h-[15px] object-contain" /></a>
          <a href="#" aria-label="YouTube" class="w-10 h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"><img src="icon/youtube.png" alt="" class="w-[15px] h-[15px] object-contain" /></a>
        </div>
      </div>
    </div>
  </footer>
</div>
