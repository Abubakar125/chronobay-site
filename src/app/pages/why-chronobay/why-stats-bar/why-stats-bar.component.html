<div class="stats-bar">
  <div class="stats-bar__inner">
    @for (stat of stats; track stat.label; let last = $last) {
      <div class="stats-bar__item" [class.stats-bar__item--last]="last">
        <p class="stats-bar__value font-cormorant">{{ stat.value }}</p>
        <p class="stats-bar__label">{{ stat.label }}</p>
      </div>
    }
  </div>
</div>
