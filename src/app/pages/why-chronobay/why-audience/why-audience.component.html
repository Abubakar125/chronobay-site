<section class="audience">
  <div class="audience__inner">
    <div class="audience__header">
      <p class="section-label">Built For</p>
      <h2 class="audience__heading font-cormorant">Who Chronobay Is For</h2>
    </div>

    <div class="audience__grid">
      @for (card of cards; track card.title) {
        <div class="audience__card glass-card">
          <div class="glass-card-shine" aria-hidden="true"></div>
          <div class="glass-card-content audience__card-inner">
            <div class="audience__icon-box">
              <img [src]="card.icon" alt="" class="audience__icon-img" width="22" height="22" />
            </div>
            <h3 class="audience__card-title font-cormorant">{{ card.title }}</h3>
            <ul class="audience__points">
              @for (point of card.points; track point) {
                <li class="audience__point">
                  <span class="audience__bullet" aria-hidden="true"></span>
                  <span class="audience__point-text">{{ point }}</span>
                </li>
              }
            </ul>
          </div>
        </div>
      }
    </div>
  </div>
</section>
