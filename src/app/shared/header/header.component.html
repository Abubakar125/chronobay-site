@if (isMenuOpen()) {
  <app-nav-menu [isOpen]="isMenuOpen()" (closed)="isMenuOpen.set(false)" />
}

<div class="mx-3 mt-3 sm:mx-5 sm:mt-5 xl:mx-8 xl:mt-8">
  <nav
    class="backdrop-blur-[2px] bg-[rgba(255,255,255,0.1)] rounded-[7px] h-[56px] sm:h-[70px] xl:h-[82px] px-3 sm:px-4 xl:px-6 flex items-center justify-between relative"
  >
    <!-- Left: social icons — hidden on mobile -->
    <div class="hidden sm:flex items-center gap-2 xl:gap-3">
      <a
        href="https://www.instagram.com/chronobay.ae?igsh=eDNxYm8zZDgxbWZ6&utm_source=qr"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
        class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
      >
        <img src="icon/insta.png" alt="" class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px] object-contain" />
      </a>
      <a
        href="https://x.com/chronobaydubai?s=11&t=BT9MJUY7m9E3uiIzpwJU4g"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="X"
        class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
      >
        <svg class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px]" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.743l7.73-8.835L1.254 2.25H8.08l4.259 5.631L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
        </svg>
      </a>
      <a
        href="https://www.linkedin.com/company/chronobayae/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
        class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
      >
        <img src="icon/linkedIn.png" alt="" class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px] object-contain" />
      </a>
      <a
        href="https://www.facebook.com/profile.php?id=61584087620668&mibextid=wwXIfr&rdid=rirzimTyqPNisfvn&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1KP94U9MEr%2F%3Fmibextid%3DwwXIfr#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
        class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
      >
        <svg class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px]" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
        </svg>
      </a>
      <a
        href="https://www.tiktok.com/@chronobay?_r=1&_t=ZS-92azYHObaHl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
        class="w-8 h-8 xl:w-10 xl:h-10 flex items-center justify-center bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.07)] rounded-[20px] transition-colors hover:bg-[rgba(255,255,255,0.08)]"
      >
        <svg class="w-[13px] h-[13px] xl:w-[15px] xl:h-[15px]" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.87a8.18 8.18 0 0 0 4.78 1.52V7.01a4.85 4.85 0 0 1-1.01-.32z"/>
        </svg>
      </a>
    </div>
    <!-- Mobile: spacer so logo stays centered -->
    <div class="sm:hidden w-8"></div>

    <!-- Center: Logo -->
    <a routerLink="/" class="absolute left-1/2 -translate-x-1/2" aria-label="Go to home">
      <img src="images/logo.svg" alt="Chronobay" class="h-9 sm:h-11 xl:h-14 w-auto" />
    </a>

    <!-- Right: CTA button + icon buttons -->
    <div class="flex items-center gap-2 xl:gap-3">
      <a href="https://dashboard.chronobay.ae/dealer-registration" target="_blank" rel="noopener noreferrer" class="glass-btn hidden lg:inline-flex">
        Apply For Membership
      </a>

      <a
        routerLink="/contact-us"
        aria-label="Contact Us"
        class="hidden sm:flex w-9 h-9 xl:w-11 xl:h-11 items-center justify-center bg-[rgba(255,255,255,0.06)] border border-[rgba(255,255,255,0.1)] rounded-[22px] transition-colors hover:bg-[rgba(255,255,255,0.1)]"
      >
        <img src="icon/person.png" alt="" class="w-[15px] h-[15px] xl:w-[18px] xl:h-[18px] object-contain" />
      </a>

      <button
        aria-label="Menu"
        class="w-9 h-9 xl:w-11 xl:h-11 flex flex-col items-center justify-center gap-[5px] bg-[rgba(255,255,255,0.06)] border border-[rgba(255,255,255,0.1)] rounded-[22px] transition-colors hover:bg-[rgba(255,255,255,0.1)]"
        (click)="isMenuOpen.set(true)"
      >
        <span class="block w-[15px] xl:w-[18px] h-px bg-cb-cream rounded-[2px]"></span>
        <span class="block w-[10px] xl:w-3 h-px bg-cb-cream rounded-[2px]"></span>
      </button>
    </div>
  </nav>
</div>
